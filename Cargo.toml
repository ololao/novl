[package]
name = "novl"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Lightweight anti-DPI transport engine"
license = "MIT"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
chacha20poly1305 = "0.10"
blake3 = "1.5"
rand = "0.8"
byteorder = "1.5"
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
tun2proxy = { version = "0.8.4", default-features = false }
jni-sys = "0.4"
log = "0.4"
socket2 = "0.5"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[lib]
name = "novl"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "novl-server"
path = "src/server_main.rs"

[[bin]]
name = "novl-client"
path = "src/client_main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
